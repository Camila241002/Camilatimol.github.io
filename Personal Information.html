<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Student's Information </title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(to right,#ede9fe,#f5f3ff);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

/* FORM BOX */
.box{
width:100%;
max-width:380px;
background:white;
padding:30px;
border-radius:30px;
box-shadow:0 0 20px rgba(124,58,237,0.2);
}

.title{
text-align:center;
font-size:42px;
color:#7c3aed;
margin-bottom:20px;
font-family:cursive;
}

input{
width:100%;
padding:14px;
margin:8px 0;
border:none;
border-radius:15px;
background:#f5f3ff;
font-size:16px;
outline:none;
}

label{
color:#7c3aed;
font-weight:bold;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:15px;
background:linear-gradient(to right,#7c3aed,#a78bfa);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.link{
margin-top:15px;
text-align:center;
color:#7c3aed;
cursor:pointer;
font-weight:bold;
}

/* DASHBOARD */
.dashboard{
display:none;
width:100%;
max-width:800px;
background:white;
padding:30px;
border-radius:30px;
box-shadow:0 0 20px rgba(124,58,237,0.2);
}

.dashboard-title{
text-align:center;
font-size:55px;
color:#7c3aed;
font-family:cursive;
margin-bottom:20px;
}

.profile{
text-align:center;
}

.profile img{
width:170px;
height:170px;
border-radius:50%;
border:6px solid #c4b5fd;
object-fit:cover;
}

.welcome{
font-size:30px;
margin-top:15px;
color:#5b21b6;
}

.card{
margin-top:25px;
background:#faf5ff;
padding:25px;
border-radius:20px;
}

.info{
display:flex;
justify-content:space-between;
padding:14px 0;
border-bottom:1px solid #ddd6fe;
font-size:18px;
}

.info:last-child{
border-bottom:none;
}

.label{
font-weight:bold;
color:#7c3aed;
}

.quote{
margin-top:20px;
background:#ede9fe;
padding:20px;
border-radius:15px;
text-align:center;
font-size:18px;
color:#5b21b6;
}

.logout-btn{
margin-top:25px;
}

</style>
</head>

<body>

<!-- REGISTER -->
<div class="box" id="registerBox">

<h1 class="title"> Register </h1>

<input type="text" id="fullname" placeholder="Full Name">

<input type="text" id="course" placeholder="Course">

<input type="number" id="age" placeholder="Age">

<input type="date" id="birthday">

<input type="text" id="address" placeholder="Address">

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<label>Upload Profile Photo</label>
<input type="file" id="photo">

<button onclick="register()">Create Account</button>

<div class="link" onclick="showLogin()">
Already have an account? Login
</div>

</div>

<!-- LOGIN -->
<div class="box" id="loginBox" style="display:none;">

<h1 class="title"> Login </h1>

<input type="text" id="loginUser" placeholder="Username">

<input type="password" id="loginPass" placeholder="Password">

<button onclick="login()">Login</button>

<div class="link" onclick="showRegister()">
Create New Account
</div>

</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

<h1 class="dashboard-title"> Dashboard </h1>

<div class="profile">

<img id="displayPhoto"
src="https://i.imgur.com/BoN9kdC.png">

<h2 class="welcome">
Welcome, <span id="displayName"></span> 💖
</h2>

</div>

<div class="card">

<div class="info">
<span class="label">Full Name</span>
<span id="displayFullname"></span>
</div>

<div class="info">
<span class="label">Course</span>
<span id="displayCourse"></span>
</div>

<div class="info">
<span class="label">Age</span>
<span id="displayAge"></span>
</div>

<div class="info">
<span class="label">Birthday</span>
<span id="displayBirthday"></span>
</div>

<div class="info">
<span class="label">Address</span>
<span id="displayAddress"></span>
</div>

<div class="info">
<span class="label">Username</span>
<span id="displayUsername"></span>
</div>

</div>

<div class="quote">
Believe in yourself and never stop chasing your dreams 
</div>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

<script>

/* SHOW LOGIN */
function showLogin(){
document.getElementById("registerBox").style.display="none";
document.getElementById("loginBox").style.display="block";
}

/* SHOW REGISTER */
function showRegister(){
document.getElementById("registerBox").style.display="block";
document.getElementById("loginBox").style.display="none";
}

/* REGISTER */
function register(){

let fullname=document.getElementById("fullname").value;
let course=document.getElementById("course").value;
let age=document.getElementById("age").value;
let birthday=document.getElementById("birthday").value;
let address=document.getElementById("address").value;
let username=document.getElementById("username").value;
let password=document.getElementById("password").value;

if(
fullname==="" ||
course==="" ||
age==="" ||
birthday==="" ||
address==="" ||
username==="" ||
password===""){
alert("Please fill all fields!");
return;
}

/* SAVE INFO */
localStorage.setItem("fullname",fullname);
localStorage.setItem("course",course);
localStorage.setItem("age",age);
localStorage.setItem("birthday",birthday);
localStorage.setItem("address",address);
localStorage.setItem("username",username);
localStorage.setItem("password",password);

/* SAVE PHOTO */
let file=document.getElementById("photo").files[0];

if(file){

let reader=new FileReader();

reader.onload=function(e){

localStorage.setItem("photo",e.target.result);

alert("Account Created Successfully!");

showLogin();

};

reader.readAsDataURL(file);

}else{

alert("Account Created Successfully!");

showLogin();

}

}

/* LOGIN */
function login(){

let user=document.getElementById("loginUser").value;
let pass=document.getElementById("loginPass").value;

let savedUser=localStorage.getItem("username");
let savedPass=localStorage.getItem("password");

if(user===savedUser && pass===savedPass){

document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";

/* DISPLAY INFO */
document.getElementById("displayName").innerText=
localStorage.getItem("fullname");

document.getElementById("displayFullname").innerText=
localStorage.getItem("fullname");

document.getElementById("displayCourse").innerText=
localStorage.getItem("course");

document.getElementById("displayAge").innerText=
localStorage.getItem("age");

document.getElementById("displayBirthday").innerText=
localStorage.getItem("birthday");

document.getElementById("displayAddress").innerText=
localStorage.getItem("address");

document.getElementById("displayUsername").innerText=
localStorage.getItem("username");

/* DISPLAY PHOTO */
let savedPhoto=localStorage.getItem("photo");

if(savedPhoto){
document.getElementById("displayPhoto").src=savedPhoto;
}

}else{
alert("Wrong Username or Password!");
}

}

/* LOGOUT */
function logout(){

document.getElementById("dashboard").style.display="none";

document.getElementById("loginBox").style.display="block";

}

</script>

</body>
</html>
